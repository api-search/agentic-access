# =============================================================================
# apis.io header + footer navigation — SINGLE SOURCE OF TRUTH
# =============================================================================
#
# Rendered by _includes/nav.html and _includes/footer.html, which are pulled in
# by _shared/_layouts/default.html. Adding a section to the whole network is now
# ONE entry in this file — no HTML edit, no hand-maintained `or` chain.
#
# HOW IT REACHES THE OTHER 31 SITES
#   bootstrap-sites.py `copy_shared()` copies this file to every site in SITES.
#   The thirteen standalone sites (not in SITES) are covered by
#   scripts/sync-nav.sh, which also VERIFIES the copy landed. Run it after any
#   edit here — see CLAUDE.md, "Nav lives in _shared".
#
# ACTIVE STATE
#   Each site's _config.yml sets `nav_active: <key>`. A top-level item lights up
#   when `site.nav_active` equals its own key OR the key of any child. So the
#   per-site nav_active values that already exist (graphql, collections, more, …)
#   keep working — just make sure new sections use a `key` that matches.
#
# URLS ARE ABSOLUTE ON PURPOSE
#   The github-pages metadata plugin injects a bogus `baseurl`
#   (/pages/<owner>/<repo>). Absolute apis.io URLs, emitted raw with no
#   relative_url/absolute_url filter, are immune to it. Same reasoning as the
#   canonical tag — see CLAUDE.md, "Consolidation".
#
# NO COUNTS HERE, DELIBERATELY
#   Entity counts live in network/_data/stats.json, which is NOT distributed to
#   the other sites (only nav.yml is). Baking counts into the menu would show
#   them on apex pages and nothing else, and would go stale between rebuilds.
#   The section landing pages carry their own counts instead.

# ---------------------------------------------------------------------------
# HEADER
#   Flat item  -> { key, label, url }
#   Menu item  -> { key, label, columns, groups: [ { header, items: [...] } ] }
# ---------------------------------------------------------------------------
header:
  - key: providers
    label: Providers
    url: https://apis.io/providers/

  - key: apis
    label: APIs
    url: https://apis.io/apis/

  # Ways to slice the catalog. This is the menu most visitors actually want:
  # last week's top queries were capability- and company-shaped ("images",
  # "weather", "mailgun", "payment processing", "RAG"), not spec-format shaped.
  - key: browse
    label: Browse
    columns: 2
    groups:
      - header: Taxonomy
        items:
          - { key: tags, label: Tags, url: 'https://apis.io/tags/' }
          - { key: industries, label: Industries, url: 'https://apis.io/industries/' }
          - { key: areas, label: Areas, url: 'https://apis.io/areas/' }
          - { key: topics, label: Topics, url: 'https://apis.io/topics/' }
      - header: Business Architecture
        items:
          - { key: capabilities, label: Business Capabilities, url: 'https://apis.io/capabilities/' }
          - { key: applications, label: Applications, url: 'https://apis.io/applications/' }
      - header: Use Cases & Features
        items:
          - { key: use-cases, label: Use Cases, url: 'https://apis.io/use-cases/' }
          - { key: features, label: Features, url: 'https://apis.io/features/' }
      - header: Geography
        items:
          - { key: regions, label: Regions, url: 'https://apis.io/regions/' }
          - { key: countries, label: Countries, url: 'https://apis.io/countries/' }
      # Regulations sit under Catalog rather than Artifacts on purpose. A standard is an
      # artifact a provider can publish; a law is context that reaches a cohort whether the
      # provider acknowledges it or not. The section's value is the join — every regulation
      # links to the countries, regions and industries it binds, and each of those pages
      # links back. See scripts/build_regulations.py.
      - header: Governance
        items:
          - { key: regulations, label: Regulations, url: 'https://apis.io/regulations/' }
      - header: Market
        items:
          - { key: vcs, label: Venture Capital, url: 'https://apis.io/vcs/' }
          - { key: secondary-market, label: Secondary Market, url: 'https://apis.io/secondary-market/' }
          - { key: estates, label: API Estates, url: 'https://apis.io/estates/' }
          - { key: gartner, label: Gartner Magic Quadrants, url: 'https://apis.io/gartner/' }
          # Kin Score Market layer (WEEKLY-CADENCE 3.14): GENERATED by all/0-working/build-market-artifacts.py.
          - { key: markets, label: Markets, url: 'https://apis.io/markets/' }

  # Machine-readable artifacts. Examples (61,836) and JSON Structure (52,894)
  # were live sections with ZERO nav entry anywhere before 2026-07-28.
  - key: artifacts
    label: Artifacts
    columns: 3
    groups:
      - header: Specifications
        items:
          # Kin, 2026-10-08: the contract itself first; /apis/ is where every indexed API carries its OpenAPI.
          - { key: openapi, label: OpenAPI, url: 'https://apis.io/apis/' }
          - { key: extensions, label: OpenAPI Extensions, url: 'https://apis.io/extensions/' }
          - { key: overlays, label: OpenAPI Overlays, url: 'https://apis.io/overlays/' }
          - { key: headers, label: HTTP Headers, url: 'https://apis.io/headers/' }
          - { key: schemas, label: Schemas, url: 'https://apis.io/schemas/' }
          - { key: json-structure, label: JSON Structure, url: 'https://apis.io/json-structure/' }
          - { key: asyncapi, label: AsyncAPI, url: 'https://apis.io/asyncapis/' }
          - { key: graphql, label: GraphQL, url: 'https://apis.io/graphqls/' }
          - { key: jsonld, label: JSON-LD, url: 'https://apis.io/jsonld/' }
          # 2026-10-08: /vocabularies/ (2,778 entries) was live with no nav entry anywhere, header or footer.
          - { key: vocabularies, label: Vocabularies, url: 'https://apis.io/vocabularies/' }
          - { key: standards, label: Standards, url: 'https://apis.io/standards/' }
      - header: Usage
        items:
          - { key: examples, label: Examples, url: 'https://apis.io/examples/' }
          - { key: collections, label: Collections, url: 'https://apis.io/collections/' }
          - { key: arazzo, label: Arazzo Workflows, url: 'https://apis.io/arazzos/' }
          - { key: events, label: Event Channels, url: 'https://apis.io/channels/' }
          - { key: webhooks, label: Webhooks, url: 'https://apis.io/webhooks/' }
          - { key: errors, label: Errors, url: 'https://apis.io/errors/' }
      - header: Agents & Governance
        items:
          - { key: agents, label: Agent Registry, url: 'https://apis.io/agents/' }
          - { key: mcp, label: MCP Servers, url: 'https://apis.io/servers/' }
          - { key: a2a, label: A2A Agent Cards, url: 'https://apis.io/a2a/' }
          - { key: ard, label: Agent Discovery, url: 'https://apis.io/ard/' }
          - { key: skills, label: Agent Skills, url: 'https://apis.io/agent-skills/' }
          - { key: llms-txt, label: llms.txt, url: 'https://apis.io/llms-txt/' }
          - { key: ai-catalog, label: AI Catalog, url: 'https://apis.io/ai-catalog/' }
          - { key: rules, label: Rules, url: 'https://apis.io/rules/' }

  # How safe / how expensive — the read-the-risk menu.
  - key: signals
    label: Signals
    columns: 2
    groups:
      - header: Security
        items:
          - { key: security, label: Security Posture, url: 'https://apis.io/security/' }
          - { key: scopes, label: OAuth Scopes, url: 'https://apis.io/scopes/' }
          - { key: agentic-access, label: Agentic Access, url: 'https://apis.io/agentic-access/' }
      - header: Commercial
        items:
          - { key: plans, label: Plans, url: 'https://apis.io/plans/' }
          - { key: rate-limits, label: Rate Limits, url: 'https://apis.io/rate-limits/' }
          - { key: sla, label: Service Levels, url: 'https://apis.io/sla/' }
          - { key: finops, label: FinOps, url: 'https://apis.io/finops/' }

  - key: rating
    label: Kin Score
    url: https://apis.io/rating/

  - key: stack
    label: Stack
    url: https://apis.io/stack/

  # Everything that used to live only in the footer's Platform and APIs.io columns (Kin,
  # 2026-11-03: footer is copyright + legal only, so every destination has a header home,
  # which is the only nav a phone sees). Agent Signup and On-Premise were flat items; they
  # moved in here so the masthead did not get wider. Both are pages, not sections, and stay
  # EXCLUDED in build_well_known_catalog.py ('/agent-signup/', '/on-premise/').
  - key: platform
    label: Platform
    columns: 2
    groups:
      - header: Developers
        items:
          - { key: developer, label: Developer Docs, url: 'https://apis.io/developer/' }
          - { key: playground, label: Agent Playground, url: 'https://apis.io/playground/' }
          - { key: changelog, label: Changelog, url: 'https://apis.io/changelog/' }
      # /trust/, /onboarding/, /agent-signup/ and /blueprint/ are one system — keep them adjacent.
      - header: Trust Layer
        items:
          - { key: trust, label: The Trust Layer, url: 'https://apis.io/trust/' }
          - { key: onboarding, label: Onboarding, url: 'https://apis.io/onboarding/' }
          - { key: kya, label: Agent Signup, url: 'https://apis.io/agent-signup/' }
          - { key: blueprint, label: Blueprint, url: 'https://apis.io/blueprint/' }
      - header: Insights
        items:
          - { key: analytics, label: Analytics, url: 'https://apis.io/analytics/' }
          - { key: search-terms, label: Search Terms, url: 'https://apis.io/search-terms/' }
      - header: APIs.io
        items:
          - { key: about, label: About, url: 'https://apis.io/about/' }
          - { key: on-premise, label: On-Premise, url: 'https://apis.io/on-premise/' }
          - { key: newsletter, label: Newsletter, url: 'https://usecommune.com/n/apisio' }
          - { key: support, label: Support, url: 'https://apis.io/support/' }
          - { key: github, label: GitHub, url: 'https://github.com/api-search' }

  - key: blog
    label: Blog
    url: https://apis.io/blog/

search:
  action: https://apis.io/
  param: search
  placeholder: Search APIs, providers, capabilities…

cta:
  label: Add your API
  url: https://apis.io/add/

# ---------------------------------------------------------------------------
# FOOTER
#   Five link columns plus a legal bar. For a 32-site, 300k+ page network the
#   footer is the primary crawl path, so it carries real destinations — not
#   just legal boilerplate (which is what it was until 2026-07-28).
# ---------------------------------------------------------------------------
footer:
  # Copyright + legal bar only (Kin, 2026-11-03). The five link columns that were here
  # (Catalog / Artifacts / Signals / Platform / APIs.io) were removed once every one of their
  # destinations had a header entry — the header is the nav that works on a phone. Don't
  # re-add columns: put a new destination in `header` above.
  # No year in the copyright: `site.time` would rewrite every page on every
  # build and churn the diff that guards against dropped providers.
  copyright: © APIs.io

  legal:
    - { label: APIs.json, url: 'http://apisjson.org' }
    - { label: API Commons, url: 'http://apicommons.org' }
    - { label: API Evangelist, url: 'https://apievangelist.com' }
    - { label: Terms, url: 'https://apis.io/terms/' }
    - { label: Privacy, url: 'https://apis.io/privacy/' }
